<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f9">
  <meta name="robots" content="noindex, nofollow">
  <title>每日資安與警政輿情晨報</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --border: #e3e6ec;
      --accent: #1d4ed8;
      --text: #1c2430;
      --muted: #5c6778;
      --danger: #dc2626;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      border-top: 4px solid var(--accent);
      word-break: normal;
      line-break: strict;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 18px 14px 40px;
    }

    header h1 {
      margin: 0 0 4px;
      font-size: 1.3rem;
      line-height: 1.35;
      font-weight: 700;
    }

    .checked {
      margin: 0;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .checked.error {
      margin-top: 14px;
      padding: 12px 14px;
      color: #991b1b;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: var(--radius);
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 2px;
    }

    p, li, h3, .k, .callout { overflow-wrap: anywhere; }

    /* summary */
    .summary {
      margin-top: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
    }

    .summary h2 { margin: 0 0 8px; font-size: 0.95rem; color: var(--muted); }
    .summary ul { margin: 0; padding-left: 1.2em; }
    .summary li { margin: 7px 0; font-size: 0.95rem; line-height: 1.7; }
    .summary li::marker { color: var(--accent); }

    /* table of contents */
    .toc {
      position: sticky;
      top: 0;
      z-index: 10;
      margin: 28px -14px 0;
      padding: 10px 14px;
      background: rgba(246, 247, 249, 0.96);
      backdrop-filter: blur(6px);
      border-top: 2px solid var(--border);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }

    .toc::-webkit-scrollbar { display: none; }

    .toc a {
      flex: 0 0 auto;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 0.82rem;
      font-weight: 600;
      color: #33415c;
    }

    .toc a:hover {
      text-decoration: none;
      border-color: var(--accent);
      color: var(--accent);
    }

    section { margin-top: 22px; scroll-margin-top: 56px; }

    section h2 {
      margin: 0 0 10px;
      padding-left: 10px;
      border-left: 4px solid var(--accent);
      font-size: 1.05rem;
      line-height: 1.4;
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    /* cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left-width: 5px;
      border-radius: var(--radius);
      padding: 12px 14px;
      min-width: 0;
    }

    .card.danger { border-left-color: var(--danger); }
    .card.warning { border-left-color: #d4a017; }
    .card.neutral { border-left-color: #9aa4b2; }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
      line-height: 1.55;
    }

    .badge.danger { background: #fee2e2; color: #b91c1c; }
    .badge.warning { background: #fef3c7; color: #92400e; }
    .badge.neutral { background: #eef1f4; color: #4b5563; }

    .card-title { margin: 6px 0 2px; font-size: 1rem; line-height: 1.45; font-weight: 700; }
    .card-title a { font-weight: 700; }

    .src { margin: 0 0 8px; color: var(--muted); font-size: 0.78rem; line-height: 1.5; }

    .blk { margin-top: 6px; padding: 7px 10px; background: #f6f8fb; border-radius: 8px; }
    .blk.act { background: #eef4ff; }
    .blk .k { display: block; font-size: 0.72rem; font-weight: 700; color: var(--muted); letter-spacing: 0.06em; }
    .blk.act .k { color: #1e40af; }
    .blk p { margin: 1px 0 0; font-size: 0.9rem; line-height: 1.6; }

    .callout {
      border-radius: var(--radius);
      padding: 10px 14px;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    .callout strong { margin-right: 0.45em; }

    .callout.info {
      background: #eef4ff;
      border: 1px solid #d4e3ff;
      border-left: 4px solid var(--accent);
      color: #1e3a8a;
    }

    .empty {
      margin: 0;
      padding: 12px;
      text-align: center;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .site-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
    }

    @media (min-width: 768px) {
      .container { padding: 28px 20px 48px; }
      header h1 { font-size: 1.7rem; }
      .summary { margin-top: 24px; padding: 20px 26px; }
      .summary li { font-size: 1rem; margin: 8px 0; }
      .toc { margin: 32px 0 0; padding: 12px 0; background: var(--bg); }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
      .card.wide { grid-column: 1 / -1; }
      section h2 { font-size: 1.15rem; }
      .card { padding: 14px 16px; }
      .card-title { font-size: 1.05rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header id="top">
      <h1 id="page-title">每日資安與警政輿情晨報</h1>
      <p id="page-meta" class="checked">載入中…</p>
    </header>

    <main id="app" hidden></main>

    <footer class="site-footer">
      <span>每日資安與警政輿情晨報</span>
      <a href="#top">回到頂部 ↑</a>
    </footer>
  </div>

  <script>
    (function () {
      var API = "https://script.google.com/macros/s/AKfycbymy9gY5jH8cPGqr59DLvntvssbjXX3qwRBuvK-rA2i7Ja8siD5zMFpegdZux9KMlM1Kw/exec?format=json";
      var titleEl = document.getElementById("page-title");
      var metaEl = document.getElementById("page-meta");
      var appEl = document.getElementById("app");

      function esc(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function has(value) {
        return value != null && String(value).trim() !== "";
      }

      function safeUrl(url) {
        var raw = String(url == null ? "" : url).trim();
        if (!/^https?:\/\/[^\s"'<>\\]+$/i.test(raw)) return "";
        return esc(raw);
      }

      function link(url, text) {
        var href = safeUrl(url);
        if (!href) return esc(text);
        return '<a href="' + href + '" target="_blank" rel="noopener">' + esc(text) + "</a>";
      }

      function toneOf(item) {
        var tone = item && item.tone;
        return tone === "danger" || tone === "warning" ? tone : "neutral";
      }

      function badge(text, tone) {
        if (!has(text)) return "";
        return '<span class="badge ' + tone + '">' + esc(text) + "</span>";
      }

      function asArray(value) {
        return Array.isArray(value) ? value : [];
      }

      function emptyBlock() {
        return '<p class="empty">本日無資料</p>';
      }

      function field(label, text, extra) {
        if (!has(text)) return "";
        return '<div class="blk' + (extra ? " " + extra : "") + '"><span class="k">' + esc(label)
          + "</span><p>" + esc(text) + "</p></div>";
      }

      function source(text) {
        return has(text) ? '<p class="src">' + esc(text) + "</p>" : "";
      }

      function title(item, text) {
        return '<h3 class="card-title">' + link(item && item.url, text) + "</h3>";
      }

      function grid(cards) {
        return cards ? '<div class="grid">' + cards + "</div>" : emptyBlock();
      }

      // First card spans both columns when the count is odd, so the grid has no orphan.
      function wide(index, count) {
        return index === 0 && count % 2 === 1 ? " wide" : "";
      }

      // Split the overview on 。 or ； (not inside brackets) into short bullets.
      function bullets(text) {
        var s = String(text == null ? "" : text);
        var out = [];
        var buf = "";
        var depth = 0;
        var i, ch;
        for (i = 0; i < s.length; i++) {
          ch = s.charAt(i);
          if ("（([【「".indexOf(ch) !== -1) depth++;
          else if ("）)]】」".indexOf(ch) !== -1 && depth > 0) depth--;
          if ((ch === "。" || ch === "；") && depth === 0) {
            if (buf.trim()) out.push(buf.trim());
            buf = "";
          } else {
            buf += ch;
          }
        }
        if (buf.trim()) out.push(buf.trim());
        return out;
      }

      function renderSummary(overview) {
        var items = bullets(overview);
        if (!items.length) return "";
        return '<div class="summary"><h2>今日摘要</h2><ul>'
          + items.map(function (b) { return "<li>" + esc(b) + "</li>"; }).join("")
          + "</ul></div>";
      }

      function renderToc() {
        return '<nav class="toc" aria-label="目錄">'
          + '<a href="#cyber">一、資安警訊</a>'
          + '<a href="#drone">二、無人機與國安</a>'
          + '<a href="#facebook">三、靠北警察 3.0</a>'
          + '<a href="#top">回頂部 ↑</a>'
          + "</nav>";
      }

      function renderCyber(items) {
        return grid(items.map(function (item, index) {
          var tone = toneOf(item);
          var heading = has(item && item.title) ? item.title : "（無標題）";
          return '<article class="card ' + tone + wide(index, items.length) + '">'
            + badge(item && item.level, tone)
            + title(item, heading)
            + source(item && item.sourceTime)
            + field("影響對象", item && item.impact)
            + field("建議處置", item && item.action, "act")
            + "</article>";
        }).join(""));
      }

      function renderDrone(items) {
        return grid(items.map(function (item, index) {
          var heading = has(item && item.title) ? item.title : "（無標題）";
          return '<article class="card neutral' + wide(index, items.length) + '">'
            + badge(item && item.category, "neutral")
            + title(item, heading)
            + source(item && item.sourceTime)
            + field("重點摘要", item && item.summary)
            + "</article>";
        }).join(""));
      }

      function renderFacebook(items) {
        return grid(items.map(function (item, index) {
          var heading = has(item && item.summary) ? item.summary : (has(item && item.id) ? item.id : "貼文");
          var meta = [item && item.id, item && item.time].filter(has).join("｜");
          var tone = (item && item.unit && String(item.unit).indexOf("本局") !== -1) ? "warning" : "neutral";
          return '<article class="card ' + tone + wide(index, items.length) + '">'
            + badge(item && item.unit, tone)
            + title(item, heading)
            + source(meta)
            + "</article>";
        }).join(""));
      }

      function buildPage(data) {
        var notice = String(data.facebookNotice == null ? "" : data.facebookNotice).trim();
        var noticeHtml = notice
          ? '<div class="callout info"><strong>今日狀態</strong>' + esc(notice) + "</div>"
          : "";
        var fbItems = asArray(data.facebook);

        return ""
          + renderSummary(data.overview)
          + renderToc()
          + '<section id="cyber">'
          + "<h2>一、高風險與國內公務機關資安警訊</h2>"
          + renderCyber(asArray(data.cyber))
          + "</section>"
          + '<section id="drone">'
          + "<h2>二、無人機資安與國安相關新聞</h2>"
          + renderDrone(asArray(data.drone))
          + "</section>"
          + '<section id="facebook">'
          + "<h2>三、社群輿情：靠北警察 3.0</h2>"
          + noticeHtml
          + (fbItems.length || !notice ? renderFacebook(fbItems) : emptyBlock())
          + "</section>";
      }

      function showError() {
        metaEl.textContent = "資料載入失敗，請稍後重新整理頁面。";
        metaEl.className = "checked error";
        appEl.hidden = true;
        appEl.innerHTML = "";
      }

      fetch(API + "&t=" + Date.now(), { cache: "no-store" })
        .then(function (res) {
          if (!res.ok) throw new Error(String(res.status));
          return res.json();
        })
        .then(function (data) {
          if (!data || typeof data !== "object" || Array.isArray(data)) throw new Error("invalid");
          var heading = "每日資安與警政輿情晨報 — " + String(data.date == null ? "" : data.date);
          titleEl.textContent = heading;
          document.title = heading;
          metaEl.className = "checked";
          metaEl.textContent = "查核時間：" + String(data.checkedAt == null ? "" : data.checkedAt);
          appEl.innerHTML = buildPage(data);
          appEl.hidden = false;
        })
        .catch(function () {
          showError();
        });
    })();
  </script>
</body>
</html>
